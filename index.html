<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Simulator - Projectile Motion & Math</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <div id="info"></div>
  <div>Launch speed: <b id="val">10.0</b> m/s</div>
  <input type="range" id="spd" min="2" max="30" step="0.1" value="10">
  <div id="forceLine"></div>
  <button id="go">LAUNCH</button>
</div>
<script src="game.js"></script>
</body>
</html>
